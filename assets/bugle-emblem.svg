<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" role="img" aria-label="Daily Bugle seal">
  <!-- black parallelogram field -->
  <polygon points="18,4 112,4 102,136 8,136" fill="#000"/>

  <!-- red disc -->
  <circle cx="60" cy="68" r="28" fill="#e12027"/>

  <!-- laurel wreath -->
  <g fill="none" stroke="#f2f2f2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- left branch -->
    <path d="M42 96 C28 78, 28 52, 44 36"/>
    <path d="M40 90 C34 86, 30 84, 28 86"/>
    <path d="M36 78 C30 74, 26 72, 24 74"/>
    <path d="M34 66 C28 62, 24 60, 22 62"/>
    <path d="M34 54 C28 50, 25 48, 23 50"/>
    <path d="M38 44 C33 40, 30 38, 28 40"/>
    <path d="M44 38 C40 34, 38 31, 37 33"/>
    <!-- right branch -->
    <path d="M78 96 C92 78, 92 52, 76 36"/>
    <path d="M80 90 C86 86, 90 84, 92 86"/>
    <path d="M84 78 C90 74, 94 72, 96 74"/>
    <path d="M86 66 C92 62, 96 60, 98 62"/>
    <path d="M86 54 C92 50, 95 48, 97 50"/>
    <path d="M82 44 C87 40, 90 38, 92 40"/>
    <path d="M76 38 C80 34, 82 31, 83 33"/>
  </g>
  <!-- leaf fills for weight -->
  <g fill="#ececec" stroke="#111" stroke-width="0.6">
    <ellipse cx="32" cy="86" rx="5" ry="2.4" transform="rotate(-35 32 86)"/>
    <ellipse cx="28" cy="74" rx="5" ry="2.4" transform="rotate(-25 28 74)"/>
    <ellipse cx="26" cy="62" rx="5" ry="2.4" transform="rotate(-15 26 62)"/>
    <ellipse cx="28" cy="50" rx="5" ry="2.4" transform="rotate(-5 28 50)"/>
    <ellipse cx="34" cy="40" rx="4.5" ry="2.2" transform="rotate(15 34 40)"/>
    <ellipse cx="88" cy="86" rx="5" ry="2.4" transform="rotate(35 88 86)"/>
    <ellipse cx="92" cy="74" rx="5" ry="2.4" transform="rotate(25 92 74)"/>
    <ellipse cx="94" cy="62" rx="5" ry="2.4" transform="rotate(15 94 62)"/>
    <ellipse cx="92" cy="50" rx="5" ry="2.4" transform="rotate(5 92 50)"/>
    <ellipse cx="86" cy="40" rx="4.5" ry="2.2" transform="rotate(-15 86 40)"/>
  </g>

  <!-- bugle / trumpet -->
  <g transform="translate(18,34) rotate(-28 42 40)">
    <!-- tubing loops -->
    <path d="M28 48
             C18 48, 14 40, 20 34
             C26 28, 40 28, 46 34
             C52 40, 48 48, 38 48
             C32 48, 30 44, 34 42
             C38 40, 44 42, 44 46"
          fill="none" stroke="#111" stroke-width="7" stroke-linecap="round"/>
    <path d="M28 48
             C18 48, 14 40, 20 34
             C26 28, 40 28, 46 34
             C52 40, 48 48, 38 48
             C32 48, 30 44, 34 42
             C38 40, 44 42, 44 46"
          fill="none" stroke="#f5f5f5" stroke-width="4.2" stroke-linecap="round"/>

    <!-- mouthpiece -->
    <rect x="8" y="45" width="18" height="6" rx="2" fill="#f5f5f5" stroke="#111" stroke-width="1.4"/>
    <circle cx="8" cy="48" r="4" fill="#e8e8e8" stroke="#111" stroke-width="1.4"/>

    <!-- valves -->
    <rect x="30" y="34" width="4" height="12" rx="1" fill="#d0d0d0" stroke="#111" stroke-width="1"/>
    <rect x="37" y="32" width="4" height="14" rx="1" fill="#d0d0d0" stroke="#111" stroke-width="1"/>
    <rect x="44" y="34" width="4" height="12" rx="1" fill="#d0d0d0" stroke="#111" stroke-width="1"/>

    <!-- bell flare -->
    <path d="M48 40
             L78 18
             C86 14, 92 20, 90 30
             L84 52
             C82 58, 74 56, 68 52
             Z"
          fill="#f5f5f5" stroke="#111" stroke-width="1.6"/>
    <path d="M58 34 L78 22 C82 20, 86 24, 84 30 L72 48 Z" fill="#cfcfcf" opacity="0.7"/>
    <!-- bell rim -->
    <ellipse cx="86" cy="30" rx="7" ry="12" fill="#eee" stroke="#111" stroke-width="1.5"/>
    <ellipse cx="86" cy="30" rx="3.5" ry="7" fill="#111"/>
  </g>
</svg>
