<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 168" role="img" aria-label="The Daily Bugle">
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff1c2"/>
      <stop offset="40%" stop-color="#e0b84d"/>
      <stop offset="100%" stop-color="#8d6a16"/>
    </linearGradient>
  </defs>

  <!-- Red masthead board -->
  <rect width="720" height="168" fill="#8f1018"/>
  <rect x="8" y="8" width="704" height="152" fill="none" stroke="#f6e7c2" stroke-width="4"/>
  <rect x="16" y="16" width="688" height="136" fill="none" stroke="#f6e7c2" stroke-width="1.5"/>

  <!-- Circular seal with trumpet/bugle -->
  <circle cx="98" cy="84" r="54" fill="#6d0b12" stroke="#f6e7c2" stroke-width="3"/>
  <circle cx="98" cy="84" r="45" fill="none" stroke="#e0b84d" stroke-width="2"/>

  <!-- Brass bugle (side view) -->
  <path d="M58 90
           C66 78 78 70 92 66
           L120 58
           L148 46
           L152 58
           L150 74
           L128 70
           C112 74 100 82 94 94
           C90 104 92 112 104 116
           L78 122
           C64 112 56 100 58 90 Z"
        fill="url(#brass)" stroke="#5c4510" stroke-width="1"/>
  <!-- mouthpiece -->
  <ellipse cx="56" cy="92" rx="7" ry="5" fill="#fff1c2" stroke="#5c4510" stroke-width="1"/>
  <!-- tubing coils -->
  <path d="M86 86 C94 78 108 76 118 80" fill="none" stroke="#5c4510" stroke-width="2"/>
  <path d="M90 96 C100 90 112 88 122 92" fill="none" stroke="#5c4510" stroke-width="2"/>
  <!-- valves -->
  <rect x="96" y="78" width="6" height="18" rx="1" fill="#6b5214"/>
  <rect x="106" y="76" width="6" height="20" rx="1" fill="#6b5214"/>
  <rect x="116" y="78" width="6" height="18" rx="1" fill="#6b5214"/>

  <!-- Masthead type -->
  <text x="420" y="62" text-anchor="middle" fill="#f6e7c2"
        font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic"
        letter-spacing="10">THE</text>
  <text x="420" y="122" text-anchor="middle" fill="#f6e7c2"
        font-family="Impact, 'Arial Black', sans-serif" font-size="64" font-weight="700"
        letter-spacing="3">DAILY BUGLE</text>
</svg>
