      <path d="M80 70 L40 300"/>
      <path d="M80 70 L20 200"/>
      <path d="M80 70 L30 110"/>
    </g>
    <g stroke-width="1.1">
      <path d="M150 85 Q210 110 250 150"/>
      <path d="M170 130 Q230 155 280 195"/>
      <path d="M145 175 Q200 205 245 250"/>
      <path d="M125 215 Q165 245 200 285"/>
      <path d="M200 100 Q255 140 300 165"/>
      <path d="M230 145 Q275 180 320 200"/>
      <path d="M180 200 Q220 230 255 255"/>
    </g>

    <!-- second burst mid-right -->
