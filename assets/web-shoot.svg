<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" fill="none" aria-hidden="true">
  <!-- Spider-Man web-shooter thwip: sticky strands shot from wrist -->
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
  </defs>

  <!-- Origin blob (web fluid leaving the shooter) -->
  <g transform="translate(70,90)">
    <ellipse cx="0" cy="0" rx="14" ry="10" fill="#111" opacity="0.55"/>
    <ellipse cx="8" cy="-2" rx="7" ry="5" fill="#222" opacity="0.45"/>

    <!-- primary strands with classic Spidey zig-zag texture -->
    <g stroke="#111" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.7">
      <path stroke-width="3.2" d="M10 0
        C40 -8, 70 12, 110 4
        C150 -6, 190 18, 240 8
        C290 -4, 340 16, 400 6
        C460 -8, 520 14, 590 2"/>
      <path stroke-width="2.6" d="M8 6
        C45 22, 85 8, 130 28
        C175 48, 220 18, 275 40
        C330 62, 385 30, 450 52
        C510 72, 570 42, 640 60"/>
      <path stroke-width="2.8" d="M6 -8
        C50 -28, 95 -10, 145 -32
        C195 -54, 250 -24, 310 -48
        C370 -70, 430 -36, 500 -58
        C560 -78, 620 -48, 690 -66"/>
      <path stroke-width="2.2" d="M4 12
        C35 40, 70 55, 110 78
        C155 105, 200 88, 250 120
        C300 150, 355 125, 420 155
        C480 182, 540 150, 610 175"/>
      <path stroke-width="2.4" d="M2 -14
        C30 -45, 65 -60, 105 -90
        C150 -125, 200 -100, 255 -140
        C310 -178, 370 -145, 440 -185"/>
    </g>

    <!-- zig-zag web texture on top of main strands -->
    <g stroke="#111" stroke-width="1.35" stroke-linecap="round" fill="none" opacity="0.55">
      <path d="M60 2 L75 -6 L90 8 L105 -4 L120 10 L135 -2 L150 8"/>
      <path d="M160 6 L175 -4 L190 12 L205 0 L220 14 L235 2 L250 12"/>
      <path d="M280 4 L295 -8 L310 10 L325 -2 L340 12 L355 0 L370 10"/>
      <path d="M90 30 L105 18 L120 38 L135 24 L150 44 L165 28 L180 48"/>
      <path d="M70 -25 L85 -38 L100 -18 L115 -34 L130 -14 L145 -30 L160 -12"/>
      <path d="M200 -40 L215 -55 L230 -32 L245 -50 L260 -28 L275 -48 L290 -26"/>
    </g>

    <!-- cross-links between strands (web mesh) -->
    <g stroke="#111" stroke-width="1.15" fill="none" opacity="0.45">
      <path d="M100 0 C115 -10, 125 -18, 140 -28"/>
      <path d="M140 8 C155 0, 165 -8, 180 -20"/>
      <path d="M180 12 C200 22, 215 30, 235 38"/>
      <path d="M220 6 C240 -6, 255 -16, 275 -30"/>
      <path d="M260 18 C280 30, 300 42, 325 52"/>
      <path d="M300 4 C320 -10, 340 -22, 365 -38"/>
      <path d="M360 20 C385 35, 410 48, 440 58"/>
      <path d="M110 45 C130 28, 145 12, 160 0"/>
      <path d="M170 55 C195 35, 215 18, 235 6"/>
      <path d="M90 -35 C115 -18, 135 -5, 155 6"/>
    </g>

    <!-- sticky droplets along strands -->
    <g fill="#111" opacity="0.5">
      <circle cx="120" cy="2" r="2.2"/>
      <circle cx="210" cy="10" r="1.8"/>
      <circle cx="305" cy="2" r="2.4"/>
      <circle cx="400" cy="8" r="1.7"/>
      <circle cx="175" cy="32" r="2"/>
      <circle cx="280" cy="42" r="1.6"/>
      <circle cx="160" cy="-28" r="2.1"/>
      <circle cx="270" cy="-42" r="1.9"/>
      <circle cx="360" cy="-50" r="1.5"/>
      <circle cx="480" cy="0" r="2"/>
    </g>
  </g>

  <!-- second thwip from upper right -->
  <g transform="translate(820,140) scale(-1,1)">
    <ellipse cx="0" cy="0" rx="12" ry="9" fill="#111" opacity="0.5"/>
    <g stroke="#111" stroke-linecap="round" fill="none" opacity="0.65">
      <path stroke-width="2.8" d="M8 0 C50 -10, 100 14, 160 2 C220 -12, 280 16, 350 4 C410 -10, 470 12, 540 0"/>
      <path stroke-width="2.3" d="M6 8 C45 28, 95 16, 145 40 C200 66, 255 38, 320 62 C380 84, 440 55, 510 74"/>
      <path stroke-width="2.4" d="M6 -10 C48 -32, 98 -16, 150 -42 C205 -70, 265 -40, 330 -68 C390 -92, 450 -58, 520 -80"/>
    </g>
    <g stroke="#111" stroke-width="1.2" fill="none" opacity="0.5">
      <path d="M70 2 L85 -6 L100 8 L115 -2 L130 10"/>
      <path d="M180 6 L195 -4 L210 12 L225 0 L240 12"/>
      <path d="M90 25 L105 14 L120 34 L135 20 L150 38"/>
      <path d="M100 -22 L115 -34 L130 -16 L145 -30 L160 -14"/>
    </g>
    <g stroke="#111" stroke-width="1.1" fill="none" opacity="0.4">
      <path d="M120 4 C140 -8, 155 -18, 175 -28"/>
      <path d="M160 18 C185 30, 205 40, 230 48"/>
      <path d="M200 0 C225 -14, 245 -26, 270 -40"/>
    </g>
    <g fill="#111" opacity="0.45">
      <circle cx="130" cy="2" r="2"/>
      <circle cx="230" cy="8" r="1.7"/>
      <circle cx="180" cy="-28" r="1.8"/>
      <circle cx="310" cy="4" r="2.1"/>
    </g>
  </g>

  <!-- third spray lower left, more chaotic -->
  <g transform="translate(40,520) rotate(18)">
    <ellipse cx="0" cy="0" rx="11" ry="8" fill="#111" opacity="0.48"/>
    <g stroke="#111" stroke-linecap="round" fill="none" opacity="0.6">
      <path stroke-width="2.5" d="M6 0 C55 8, 110 -10, 170 6 C230 22, 290 -4, 360 12"/>
      <path stroke-width="2.1" d="M4 10 C50 30, 105 48, 165 35 C225 22, 285 55, 350 42"/>
      <path stroke-width="2.2" d="M4 -8 C48 -28, 100 -18, 155 -42 C210 -66, 270 -40, 335 -58"/>
    </g>
    <g stroke="#111" stroke-width="1.15" fill="none" opacity="0.48">
      <path d="M80 4 L95 -4 L110 10 L125 0 L140 12"/>
      <path d="M190 8 L205 -2 L220 14 L235 4 L250 14"/>
      <path d="M100 28 L115 16 L130 36 L145 22 L160 40"/>
    </g>
    <g fill="#111" opacity="0.42">
      <circle cx="100" cy="2" r="1.8"/>
      <circle cx="200" cy="8" r="2"/>
      <circle cx="280" cy="0" r="1.5"/>
    </g>
  </g>
</svg>
