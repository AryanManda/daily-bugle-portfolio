      <path d="M40 40 L0 0"/>
      <path d="M40 40 L70 5"/>
      <path d="M40 40 L85 40"/>
      <path d="M40 40 L75 75"/>
      <path d="M40 40 L25 80"/>
      <path d="M40 40 L0 55"/>
      <path d="M18 25 L55 20"/>
      <path d="M20 50 L58 45"/>
      <path d="M30 20 L50 55"/>
