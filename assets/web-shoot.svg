    <!-- loose strand across page -->
    <path stroke-width="1.3" d="M40 520 C180 480, 320 560, 480 500 S780 470, 980 540 S1120 610, 1180 580"/>
    <path stroke-width="1" d="M60 560 C220 530, 360 600, 520 545 S820 520, 1040 590"/>

    <!-- bottom spray -->
